    <!-- Tailwind CSS CDN -->

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
        }
        .font-title {
            font-family: 'Black Han Sans', sans-serif;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5), inset 0 0 10px rgba(236, 72, 153, 0.3);
        }
        .neon-glow-green {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
        }
        .neon-glow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(2deg); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(6px, 0, 0) rotate(1deg); }
        }
        .bounce-gentle {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 flex flex-col justify-between">

    <div id="root"></div>

    <script type="text/babel">
        // Sound effects generator using Web Audio API
        const createAudioContext = () => {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            return new AudioCtx();
        };

        const soundManager = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = createAudioContext();
                }
            },
            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.2); // A5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            },
            playWrong() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            },
            playCombo() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [440, 554.37, 659.25, 880].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            }
        };

        // Hood Roasts for Wrong Answers
        const HOOD_ROASTS = [
            "야 실화냐?! 뇌 유체이탈했냐? 정신차려 자슥아! 💀",
            "너랑 내 수학 실력 차이는 정비례로 무한대까지 벌어지는 중 ㅋ",
            "와~ 이걸 틀리네! 님 혹시 정비례를 몸으로 감지하십니까?",
            "에휴, 네 IQ랑 틀린 횟수는 정비례 관계인 듯~ 🔥",
            "힙합 스웨그는 100점인데 수학 스웨그는 -50점이다 브로!",
            "어이 거기 길을 잃었나? y = ax 라고 몇 번을 말해야 알아듣냐!",
            "손가락이 패닉을 일으켰냐? 계산기 말고 뇌를 가동해라!",
            "이건 우리 집 강아지도 꼬리로 찍어서 맞히겠다 멍멍! 🐶",
            "뇌 회전 속도가 정비례가 아니라 반비례로 줄어드는 중 ㅋ",
            "힙합 정신으로 찍지 마라! 수학은 과학이다 자슥아!",
            "너 혹시 정비례 뜻이 '정말 비참한 실수' 인 줄 아는 거냐?!",
            "아니 x가 증가할 때 y도 일정하게 증가한다고!! 왜 너만 후퇴하냐!"
        ];

        const PRAISES = [
            "오~ 개기깔쌈뽕깔롱한 계산능력인데?! 😎",
            "폼 미쳤다!! 정비례 마스터 인정한다 브로! 🔥",
            "지렸다! 뇌 회전속도 초고속 정비례 증가 중! ⚡",
            "비트 타고 수학 푸는 거냐?! 나이스 샷! 🎧",
            "수학의 정석도 울고 갈 깔끔한 정답! 💎"
        ];

        // Dynamic proportion problem generator with high variety & robust math validation
        function generateProblem(difficulty = 'normal') {
            // Select category based on difficulty level
            let type;
            if (difficulty === 'easy') {
                type = [1, 2, 3, 4][Math.floor(Math.random() * 4)];
            } else if (difficulty === 'normal') {
                type = [1, 2, 3, 4, 5, 6, 7, 8][Math.floor(Math.random() * 8)];
            } else {
                // Hard mode (불닭): Advanced geometry, parameter inequalities, dual lines, and multi-step math
                type = [5, 6, 7, 8, 9, 10, 11, 12, 13][Math.floor(Math.random() * 9)];
            }

            let question = "";
            let answer = "";
            let options = [];
            let explanation = "";
            let context = "";

            if (type === 1) {
                // Category 1: Basic Formula Identification
                const isTrue = Math.random() > 0.5;
                if (isTrue) {
                    const validA = [4, -6, "3/5", "-7/2", 1.2][Math.floor(Math.random() * 5)];
                    question = "다음 보기 중 y가 x에 '정비례'하는 관계식은 무엇일까?";
                    answer = `y = ${validA}x`;
                    options = [answer, `y = 8/x`, `y = 3x - 4`, `y = 2x²`].sort(() => Math.random() - 0.5);
                    context = "정비례 관계식은 y = ax (a ≠ 0) 형태이어야 합니다.";
                    explanation = `y = ax 꼴인 [${answer}]만 정비례 관계식입니다!`;
                } else {
                    const aVal = [5, -3, "2/3"][Math.floor(Math.random() * 3)];
                    question = "다음 중 y가 x에 정비례하지 '않는' 관계식은 무엇일까?";
                    answer = `y = 12/x`;
                    options = [`y = ${aVal}x`, `y = -0.4x`, `y = (5/2)x`, answer].sort(() => Math.random() - 0.5);
                    context = "y = ax 형태가 아닌 식을 찾으세요. x가 분모에 있는 y = a/x는 반비례 관계입니다.";
                    explanation = `y = 12/x 는 x가 분모에 있는 반비례 관계식이므로 정비례가 아닙니다!`;
                }

            } else if (type === 2) {
                // Category 2: Table Completion
                const a = (Math.floor(Math.random() * 6) + 2) * (Math.random() > 0.5 ? 1 : -1);
                const x1 = -3;
                const y1 = a * x1;
                const x2 = 4;
                const y2 = a * x2;
                const x3 = Math.floor(Math.random() * 4) + 5;
                const y3 = a * x3;

                question = `다음 정비례 관계 표에서 빈칸 [ ? ]에 들어갈 수 k는?\n[ x :  ${x1}  |  ${x2}  |  ${x3} ]\n[ y :  ${y1}  |  ${y2}  |  [ ? ] ]`;
                answer = String(y3);
                options = [
                    answer,
                    String(y3 + (a > 0 ? 4 : -4)),
                    String(-y3),
                    String(y3 + a * 2)
                ].sort(() => Math.random() - 0.5);
                context = "y/x = a 비례상수를 구한 뒤 x에 대입하세요.";
                explanation = `y/x = ${y1}/(${x1}) = ${a} 이므로 관계식은 y = ${a}x 입니다. x = ${x3} 일 때 y = ${a} × ${x3} = ${y3} 입니다!`;

            } else if (type === 3) {
                // Category 3: Basic Point Verification
                const a = (Math.floor(Math.random() * 5) + 2) * (Math.random() > 0.5 ? 1 : -1);
                const validX = 3;
                const validY = a * validX;
                const invalidY = validY + (Math.random() > 0.5 ? 4 : -4);

                question = `정비례 관계 y = ${a}x 의 그래프가 지나지 '않는' 점은?`;
                answer = `(${validX}, ${invalidY})`;
                options = [
                    `(1, ${a})`,
                    `(-2, ${a * -2})`,
                    answer,
                    `(0, 0)`
                ].sort(() => Math.random() - 0.5);
                context = "x좌표를 y = ax에 대입했을 때 y좌표가 성립하지 않는 점을 찾으세요.";
                explanation = `x = ${validX} 대입 시 y = ${a} × ${validX} = ${validY} 이어야 하므로 (${validX}, ${invalidY})는 지나지 않습니다!`;

            } else if (type === 4) {
                // Category 4: Quadrant & Sign Deduction
                const isQuad13 = Math.random() > 0.5;
                if (isQuad13) {
                    question = "정비례 관계 y = ax 의 그래프가 '제1사분면과 제3사분면'을 지날 때, 비례상수 a의 값으로 가능한 것은?";
                    answer = "3.2";
                    options = [answer, "-4", "-1.5", "-8"].sort(() => Math.random() - 0.5);
                    context = "제1, 3사분면을 지나면 비례상수 a는 양수(a > 0)입니다.";
                    explanation = "제1, 3사분면을 지나는 정비례 그래프는 a > 0 이어야 하므로 3.2가 정답입니다!";
                } else {
                    question = "정비례 관계 y = ax 의 그래프가 '제2사분면과 제4사분면'을 지날 때, 비례상수 a의 값으로 가능한 것은?";
                    answer = "-6.5";
                    options = [answer, "1.8", "7", "0.5"].sort(() => Math.random() - 0.5);
                    context = "제2, 4사분면을 지나면 비례상수 a는 음수(a < 0)입니다.";
                    explanation = "제2, 4사분면을 지나는 정비례 그래프는 a < 0 이어야 하므로 -6.5가 정답입니다!";
                }

            } else if (type === 5) {
                // Category 5: Comparing Fractional Slopes (|a| Proximity)
                // Set up fractions with distinct absolute values
                const items = [
                    { str: "y = (11/4)x", abs: 2.75 },
                    { str: "y = (-14/5)x", abs: 2.80 },
                    { str: "y = (8/3)x", abs: 2.67 },
                    { str: "y = (-23/9)x", abs: 2.56 }
                ].sort(() => Math.random() - 0.5);

                const isYaxis = Math.random() > 0.5;
                if (isYaxis) {
                    question = "다음 정비례 관계 그래프 중 y축에 '가장 가까운' (경사가 가장 가파른) 것은?";
                    const sorted = [...items].sort((p, q) => q.abs - p.abs);
                    answer = sorted[0].str;
                    options = items.map(i => i.str);
                    context = "비례상수 a의 절댓값 |a|가 가장 큰 그래프가 y축에 가장 가깝습니다.";
                    explanation = `절댓값을 비교하면: |11/4|=2.75, |-14/5|=2.80, |8/3|≈2.67, |-23/9|≈2.56 입니다. 따라서 |a|가 가장 큰 [${answer}]가 y축에 가장 가깝습니다!`;
                } else {
                    question = "다음 정비례 관계 그래프 중 x축에 '가장 가까운' (경사가 가장 완만한) 것은?";
                    const sorted = [...items].sort((p, q) => p.abs - q.abs);
                    answer = sorted[0].str;
                    options = items.map(i => i.str);
                    context = "비례상수 a의 절댓값 |a|가 가장 작은 그래프가 x축에 가장 가깝습니다.";
                    explanation = `절댓값을 비교하면: |11/4|=2.75, |-14/5|=2.80, |8/3|≈2.67, |-23/9|≈2.56 입니다. 따라서 |a|가 가장 작은 [${answer}]가 x축에 가장 가깝습니다!`;
                }

            } else if (type === 6) {
                // Category 6: Finding Parameter 'a' from Fractional Point
                const num = (Math.floor(Math.random() * 5) + 2) * (Math.random() > 0.5 ? 1 : -1); // e.g. -3
                const den = Math.floor(Math.random() * 3) + 2; // e.g. 4 -> a = -3/4
                const testX = den * (Math.floor(Math.random() * 3) + 2); // e.g. 8
                const testY = (num / den) * testX; // e.g. -6

                question = `정비례 관계 y = ax 의 그래프가 점 (${testX}, ${testY})를 지날 때, 비례상수 a의 값은?`;
                answer = `${num}/${den}`;
                options = [
                    answer,
                    `${den}/${num}`,
                    `${-num}/${den}`,
                    `${num + 1}/${den}`
                ].sort(() => Math.random() - 0.5);
                context = "점의 좌표를 y = ax 에 대입하여 a = y / x 로 계산하세요.";
                explanation = `a = y / x = ${testY} / ${testX} = ${num}/${den} 이므로 비례상수 a = [${answer}] 입니다!`;

            } else if (type === 7) {
                // Category 7: Multi-tap Combined Water Flow Word Problem
                const rateA = Math.floor(Math.random() * 4) + 3; // e.g. 5 L/min
                const rateB = Math.floor(Math.random() * 5) + 4; // e.g. 7 L/min
                const totalRate = rateA + rateB; // e.g. 12 L/min
                const minA = 2;
                const amountA = rateA * minA;
                const minB = 3;
                const amountB = rateB * minB;
                const targetTime = Math.floor(Math.random() * 6) + 10; // e.g. 15 min
                const targetAmount = totalRate * targetTime;

                question = `A 수도꼭지는 ${minA}분 동안 ${amountA}L, B 수도꼭지는 ${minB}분 동안 ${amountB}L의 물이 나온다. 두 수도꼭지를 동시에 열어 x분 동안 받은 물의 양을 y L라 할 때, ${targetTime}분 동안 채워지는 물의 총량은?`;
                answer = `${targetAmount}L`;
                options = [
                    answer,
                    `${targetAmount - 30}L`,
                    `${targetAmount + 24}L`,
                    `${targetAmount + 50}L`
                ].sort(() => Math.random() - 0.5);
                context = "A, B의 1분당 물출력량을 각각 구한 뒤 합산하여 y = (합산1분량)x 관계식을 만드세요.";
                explanation = `A 수도꼭지 = ${amountA}/${minA} = ${rateA}L/분, B 수도꼭지 = ${amountB}/${minB} = ${rateB}L/분. 두 수도꼭지를 합치면 1분당 ${totalRate}L이 흘러나옵니다 (y = ${totalRate}x).따라서 ${targetTime}분 동안은 ${totalRate} × ${targetTime} = ${targetAmount}L 입니다!`;

            } else if (type === 8) {
                // Category 8: Equation Transformation (Ax + By = 0)
                const A = (Math.floor(Math.random() * 5) + 2) * (Math.random() > 0.5 ? 1 : -1);
                const B = Math.floor(Math.random() * 4) + 2; // e.g., 3x - 5y = 0 -> y = (3/5)x
                // Ax + By = 0 => By = -Ax => y = (-A/B)x
                const ratioStr = (-A % B === 0) ? String(-A / B) : `-${A}/${B}`;

                question = `관계식 ${A > 0 ? `${A}x` : `${A}x`} ${B >= 0 ? `+ ${B}y` : `- ${Math.abs(B)}y`} = 0 을 y = ax 꼴로 고쳤을 때, 비례상수 a의 값은?`;
                answer = ratioStr;
                options = [
                    answer,
                    (-A % B === 0) ? String(A / B) : `${A}/${B}`,
                    (B % Math.abs(A) === 0) ? String(-B / Math.abs(A)) : `-${B}/${Math.abs(A)}`,
                    "0"
                ].sort(() => Math.random() - 0.5);
                context = "y항만 좌변에 남기고 이항한 후, y의 계수로 양변을 나누세요.";
                explanation = `${B}y = ${-A}x 이므로 양변을 ${B}로 나누면 y = (${ratioStr})x 가 됩니다. 따라서 비례상수 a = [${answer}] 입니다!`;

            } else if (type === 9) {
                // 🔥 Category 9 (불닭): Coordinate Geometry - Triangle Area formed by line y = ax, x = k, and x-axis
                const baseK = Math.floor(Math.random() * 4) + 3; // e.g., k = 6
                const targetArea = (Math.floor(Math.random() * 6) + 3) * 6; // e.g., 36
                // Area = (1/2) * baseK * heightY = targetArea => heightY = (2 * targetArea) / baseK
                const heightY = (2 * targetArea) / baseK; // integer height
                // y = a * baseK => heightY = a * baseK => a = heightY / baseK
                const aNum = heightY;
                const aDen = baseK;
                // Simplified string for 'a'
                const gcd = (u, v) => v === 0 ? u : gcd(v, u % v);
                const g = gcd(aNum, aDen);
                const simplifiedA = (aDen / g === 1) ? String(aNum / g) : `${aNum / g}/${aDen / g}`;

                question = `🔥[불닭] 정비례 y = ax (a > 0)의 그래프 위의 점 P(${baseK}, b)와 점 A(${baseK}, 0), 원점 O(0,0)을 꼭짓점으로 하는 삼각형 OPA의 넓이가 ${targetArea}일 때, 비례상수 a의 값은?`;
                answer = simplifiedA;
                options = [
                    answer,
                    (aDen / g === 1) ? String((aNum / g) + 1) : `${aNum / g + 1}/${aDen / g}`,
                    (aDen / g === 1) ? String(Math.max(1, (aNum / g) - 1)) : `${aNum / g}/${aDen / g + 1}`,
                    `${targetArea}/${baseK}`
                ].sort(() => Math.random() - 0.5);
                context = "삼각형 OPA의 넓이 = (1/2) × (밑변 OA의 길이) × (높이 AP의 길이) 공식을 이용하세요.";
                explanation = `밑변 OA = ${baseK}, 넓이 = ${targetArea} 이므로 (1/2) × ${baseK} × b = ${targetArea} ⇒ ${baseK / 2}b = ${targetArea} ⇒ b = ${heightY}. 점 P(${baseK}, ${heightY})가 y = ax 위에 있으므로 ${heightY} = ${baseK}a ⇒ a = ${simplifiedA} 입니다!`;

            } else if (type === 10) {
                // 🔥 Category 10 (불닭): Coordinate Relation Sum Condition (m + n = K) on y = ax
                const aFrac = -3.5; // y = -3.5x
                const mVal = (Math.floor(Math.random() * 5) + 2) * -2; // e.g., -6
                const nVal = aFrac * mVal; // e.g., 21
                const sumMN = mVal + nVal; // e.g., 15

                question = `🔥[불닭] 정비례 관계 y = -3.5x 의 그래프 위의 점 A(m, n)에 대하여 m + n = ${sumMN} 일 때, x좌표 m의 값은?`;
                answer = String(mVal);
                options = [
                    answer,
                    String(-mVal),
                    String(mVal * 2),
                    String(sumMN)
                ].sort(() => Math.random() - 0.5);
                context = "n = -3.5m 을 m + n 식에 대입하여 m에 대한 1차방정식을 풀어보세요.";
                explanation = `n = -3.5m 이므로 m + n = m + (-3.5m) = -2.5m = ${sumMN} 입니다. 따라서 m = ${sumMN} / (-2.5) = [${mVal}] 이 정답입니다!`;

            } else if (type === 11) {
                // 🔥 Category 11 (불닭): Distance between two points on two direct proportion graphs at x = k
                const a1Num = 7, a1Den = 2; // y1 = (7/2)x
                const a2Num = -3, a2Den = 2; // y2 = (-3/2)x
                const kVal = Math.floor(Math.random() * 4) + 3; // e.g., k = 5
                const y1Val = (a1Num / a1Den) * kVal; // 3.5k
                const y2Val = (a2Num / a2Den) * kVal; // -1.5k
                const distancePQ = y1Val - y2Val; // 5k -> e.g. 25

                question = `🔥[불닭] 두 정비례 관계 y = 3.5x 와 y = -1.5x 의 그래프 위의 x좌표가 k (k > 0)인 두 점을 각각 P, Q라 하자. 선분 PQ의 길이가 ${distancePQ} 일 때, k의 값은?`;
                answer = String(kVal);
                options = [
                    answer,
                    String(kVal + 2),
                    String(kVal * 2),
                    String(Math.max(1, kVal - 1))
                ].sort(() => Math.random() - 0.5);
                context = "점 P의 y좌표에서 점 Q의 y좌표를 뺀 차이가 선분 PQ의 길이입니다.";
                explanation = `P의 y좌표 = 3.5k, Q의 y좌표 = -1.5k 입니다. 선분 PQ의 길이 = 3.5k - (-1.5k) = 5k = ${distancePQ} 이므로 k = [${kVal}] 입니다!`;

            } else if (type === 12) {
                // 🔥 Category 12 (불닭): Ratio of two proportional constants (a ÷ b)
                const p1 = { x: 4, y: -10 }; // a = -2.5 = -5/2
                const p2 = { x: -6, y: 9 };   // b = -1.5 = -3/2
                // a / b = (-5/2) / (-3/2) = 5/3

                question = `🔥[불닭] 정비례 y = ax 의 그래프가 점 (${p1.x}, ${p1.y})를 지나고, 정비례 y = bx 의 그래프는 점 (${p2.x}, ${p2.y})를 지난다. 이때 비례상수의 나눗셈 a ÷ b 의 값은?`;
                answer = "5/3";
                options = [
                    answer,
                    "3/5",
                    "-5/3",
                    "15/4"
                ].sort(() => Math.random() - 0.5);
                context = "각 점의 좌표를 대입하여 a와 b를 각각 구한 뒤 a/b를 계산하세요.";
                explanation = `a = ${p1.y}/${p1.x} = -5/2 이고, b = ${p2.y}/(${p2.x}) = -3/2 입니다. 따라서 a ÷ b = (-5/2) ÷ (-3/2) = [5/3] 입니다!`;

            } else {
                // 🔥 Category 13 (불닭): Parameter Range Inequality from Quadrant Condition
                const kCoeff = Math.floor(Math.random() * 3) + 2; // e.g. 3
                const constNum = kCoeff * (Math.floor(Math.random() * 3) + 2); // e.g. 3 * 3 = 9 -> (3k - 9)x + 2y = 0
                const targetK = constNum / kCoeff; // 3

                question = `🔥[불닭] 정비례 관계식 (${kCoeff}k - ${constNum})x + 2y = 0 의 그래프가 제2사분면과 제4사분면을 지날 때, 상수 k의 값의 범위는?`;
                answer = `k > ${targetK}`;
                options = [
                    answer,
                    `k < ${targetK}`,
                    `k > ${constNum}`,
                    `k = ${targetK}`
                ].sort(() => Math.random() - 0.5);
                context = "y = ax 꼴로 정리한 후, 제2, 4사분면을 지나기 위한 조건 (a < 0)을 부등식으로 푸세요.";
                explanation = `2y = -(${kCoeff}k - ${constNum})x ⇒ y = [(${constNum} - ${kCoeff}k)/2]x 입니다. 제2, 4사분면을 지나려면 비례상수 (${constNum} - ${kCoeff}k)/2 < 0 이여야 하므로 ${constNum} < ${kCoeff}k ⇒ k > ${targetK} 가 정답입니다!`;
            }

            // Ensure unique options
            const optSet = new Set(options);
            let fallbackIdx = 1;
            while (optSet.size < 4) {
                optSet.add(`옵션 ${fallbackIdx++}`);
            }

            return {
                id: Date.now() + Math.random(),
                question,
                answer,
                options: Array.from(optSet).sort(() => Math.random() - 0.5),
                explanation,
                context
            };
        }

        function App() {

                                힙

                        >
                            📈 그래프 시각화 실습
                        </button>
                    </div>

                    {}
                    {mode === 'visualizer' ? (
                        /* Graph Visualizer Tab */
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                            <h2 className="text-xl font-bold mb-2 text-cyan-400 flex items-center gap-2">
                                📊 정비례 그래프 탐구소 ($y = ax$)
                            </h2>
                            <p className="text-sm text-slate-400 mb-6">
                                비례상수 <code className="bg-slate-800 px-2 py-0.5 rounded text-pink-400">a</code>의 값을 슬라이더로 움직여 그래프의 기울기와 원점 지나기 특성을 직접 확인해봐!
                            </p>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                                {/* SVG Interactive Graph */}
                                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col items-center justify-center relative min-h-[320px]">
                                    <svg viewBox="-100 -100 200 200" className="w-full max-w-[280px] h-[280px]">
                                        {/* Grid lines */}
                                        <line x1="-100" y1="0" x2="100" y2="0" stroke="#334155" strokeWidth="1" />
                                        <line x1="0" y1="-100" x2="0" y2="100" stroke="#334155" strokeWidth="1" />
                                        
                                        {/* Grid ticks */}
                                        {[-80, -60, -40, -20, 20, 40, 60, 80].map(v => (
                                            <g key={v}>
                                                <line x1={v} y1="-3" x2={v} y2="3" stroke="#475569" strokeWidth="1" />
                                                <line x1="-3" y1={v} x2="3" y2={v} stroke="#475569" strokeWidth="1" />
                                            </g>
                                        ))}

                                        {/* Line y = ax (SVG canvas Y is inverted) */}
                                        <line 
                                            x1="-100" 
                                            y1={100 * graphA} 
                                            x2="100" 
                                            y2={-100 * graphA} 
                                            stroke="#ec4899" 
                                            strokeWidth="3.5" 
                                            strokeLinecap="round"
                                        />

                                        {/* Origin Dot */}
                                        <circle cx="0" cy="0" r="4" fill="#38bdf8" />
                                        
                                        {/* Labels */}
                                        <text x="88" y="-8" fill="#94a3b8" fontSize="10">x</text>

                                        />
                                        <div className="flex justify-between text-xs text-slate-500 mt-1 font-mono">
                                            <span>-5 (오른쪽 아래)</span>
                                            <span>0 (x축)</span>
                                            <span>+5 (오른쪽 위)</span>
                                        </div>
                                    </div>

                                    <div className="bg-slate-800/40 border border-slate-700/50 p-4 rounded-xl space-y-2 text-xs text-slate-300">
                                        <h4 className="font-bold text-sm text-yellow-400 mb-1">💡 정비례 핵심 족보 요약</h4>
                                        <p>1. 정비례 관계식은 항상 <strong className="text-pink-400">y = ax (a ≠ 0)</strong> 형태이다.</p>
                                        <p>2. 그래프는 반드시 원점 <strong className="text-cyan-400">(0, 0)</strong>을 지나는 직선이다.</p>
                                        <p>3. <strong className="text-emerald-400">a &gt; 0</strong> 일 때: 제1, 3사분면을 지나며 오른쪽 위로 향함.</p>
                                        <p>4. <strong className="text-red-400">a &lt; 0</strong> 일 때: 제2, 4사분면을 지나며 오른쪽 아래로 향함.</p>
                                        <p>5. <strong className="text-purple-400 font-mono">|a|</strong>의 값이 크면 클수록 y축에 더 바짝 가까워진다!</p>
                                    </div>
                                </div>
                            </div>

                    ) : (

                                    <div className="flex items-center gap-3">

                                /* Speed run Game Over Modal */
                                <div className="bg-slate-900 border border-amber-500/40 rounded-2xl p-8 text-center space-y-4">

                                    <p className="text-slate-300">30초 동안 당신이 기록한 개기깔쌈 점수:</p>
                                    <div className="text-5xl font-black font-mono text-pink-400 my-4">{score} 점</div>
                                    <p className="text-sm text-slate-400">최대 연속 정답 스트릭: <span className="text-amber-300 font-bold">{highStreak}회</span></p>
                                    <button
                                        onClick={startSpeedRun}
                                        className="bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-extrabold text-lg px-8 py-3 rounded-xl shadow-lg transition-transform active:scale-95"
                                    >
                                        🔥 다시 도전하기
                                    </button>
                                </div>
                            ) : (
                                /* Main Math Card */
                                <div className={`bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden transition-all ${
                                    shakeCard ? 'shake neon-glow-red border-red-500' : ''
                                } ${isCorrect === true ? 'neon-glow-green border-green-500' : ''}`}>

                                    {/* Difficulty selector (Non-speedrun) */}
                                    {!isSpeedRun && (
                                        <div className="flex justify-between items-center mb-6">
                                            <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">
                                                QUESTION CARD
                                            </span>
                                            <div className="flex gap-2">
                                                {[
                                                    { id: 'easy', label: '입문 (쉬움)' },
                                                    { id: 'normal', label: '표준 (보통)' },
                                                    { id: 'hard', label: '🔥 불닭 (매운맛)' }
                                                ].map((diff) => (
                                                    <button
                                                        key={diff.id}
                                                        onClick={() => { setDifficulty(diff.id); handleNextProblem(); }}
                                                        className={`text-xs px-3 py-1 rounded-full font-bold transition-all ${
                                                            difficulty === diff.id
                                                                ? (diff.id === 'hard' ? 'bg-gradient-to-r from-red-600 to-amber-500 text-white font-black animate-pulse' : 'bg-pink-500 text-white')
                                                                : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                                                        }`}
                                                    >
                                                        {diff.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Question Text */}
                                    {currentProblem && (
                                        <div className="space-y-4">
                                            <div className="bg-slate-950 border border-slate-800/80 rounded-xl p-4 text-xs text-slate-400 font-mono">
                                                📌 팁: {currentProblem.context}
                                            </div>
                                            <h3 className="text-xl md:text-2xl font-bold text-slate-100 leading-relaxed whitespace-pre-line">
                                                {currentProblem.question}
                                            </h3>

                                            {/* Options Grid */}
                                            {}
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4">
                                                {currentProblem.options.map((option, idx) => {
                                                    let btnStyle = "bg-slate-950 border-slate-800 hover:border-slate-600 text-slate-200 hover:bg-slate-800/60";
                                                    
                                                    if (selectedOption !== null) {
                                                        if (option === currentProblem.answer) {
                                                            btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-300 font-extrabold shadow-lg shadow-emerald-500/20";
                                                        } else if (option === selectedOption) {
                                                            btnStyle = "bg-red-950/80 border-red-500 text-red-300 font-bold";
                                                        } else {
                                                            btnStyle = "bg-slate-950/40 border-slate-900 text-slate-600 opacity-40";

                                                    }

                                                    return (
                                                        <button
                                                            key={idx}
                                                            disabled={selectedOption !== null}
                                                            onClick={() => handleAnswer(option)}
                                                            className={`p-4 rounded-xl border-2 text-left font-mono text-lg transition-all flex items-center justify-between ${btnStyle}`}
                                                        >
                                                            <span><strong className="text-xs text-slate-500 mr-2 font-sans">{idx + 1}.</strong> {option.toLocaleString()}</span>
                                                            {selectedOption !== null && option === currentProblem.answer && (
                                                                <span className="text-emerald-400">✓ 정답</span>
                                                            )}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {}
                                    {/* Feedback & Roast Box */}
                                    {selectedOption !== null && (
                                        <div className="mt-6 pt-6 border-t border-slate-800 space-y-4 animate-fade-in">
                                            <div className={`p-4 rounded-2xl border flex items-start gap-4 ${
                                                isCorrect
                                                    ? 'bg-emerald-950/50 border-emerald-500/50 text-emerald-200'
                                                    : 'bg-red-950/60 border-red-500/60 text-red-200'
                                            }`}>
                                                <div className="text-3xl shrink-0">
                                                    {isCorrect ? '🕶️' : '💀'}
                                                </div>
                                                <div className="space-y-1">
                                                    <div className="font-extrabold text-sm tracking-wide uppercase flex items-center gap-2">
                                                        <span>{isCorrect ? 'HOOD MASTER의 칭찬' : 'HOOD MASTER의 팩폭 DISS'}</span>
                                                    </div>
                                                    <p className="text-base font-black leading-snug">
                                                        "{roastText}"
                                                    </p>
                                                    <p className="text-xs opacity-80 pt-2 font-mono border-t border-slate-800/60 mt-2">
                                                        💡 풀이: {currentProblem.explanation}
                                                    </p>
                                                </div>
                                            </div>

                                            <button
                                                onClick={handleNextProblem}
                                                className="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:to-pink-600 text-white font-extrabold text-lg py-3.5 rounded-xl shadow-lg transition-transform active:scale-98 flex items-center justify-center gap-2"
                                            >
                                                <span>다음 문제 부수러 가기</span>
                                                <span>➡️</span>
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {}
                    {/* Hood Math Cheat Sheet Drawer */}
                    <footer className="mt-8 bg-slate-900/60 border border-slate-800 rounded-2xl p-4 text-center text-xs text-slate-500">
                        <div className="flex justify-center items-center gap-4 text-slate-400 font-semibold mb-2">
                            <span>⚡ 정비례 공식: <code className="text-pink-400">y = ax</code></span>
                            <span>•</span>
                            <span>🎯 x가 2배, 3배가 되면 y도 2배, 3배가 됨!</span>
                        </div>
                        <p>© 2026 Hood Math Master. 틀리면 후드 스타일 팩폭을 맞지만 실력은 정비례로 폭풍 상승합니다!</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
